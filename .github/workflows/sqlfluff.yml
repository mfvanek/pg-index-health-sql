name: Lint with SQLFluff

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Run SQLFluff
        uses: docker://sqlfluff/sqlfluff:4.5.0
        with:
          args: lint sql --format github-annotation-native
